<!-- designed by mew -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 315" role="img" aria-labelledby="title desc">
  <title id="title">Website and content service architecture</title>
  <desc id="desc">Visitors use the Vue website, Nginx serves pages and media and forwards API requests, Django manages content, and SQLite stores data.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#0b8990" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="315" rx="24" fill="#f5fafb"/>
  <text x="45" y="50" fill="#173941" font-family="Arial, sans-serif" font-size="24" font-weight="700">Website and content service</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#d7e7e9" stroke-width="2">
      <rect x="42" y="88" width="244" height="140" rx="17"/>
      <rect x="332" y="88" width="244" height="140" rx="17"/>
      <rect x="622" y="88" width="244" height="140" rx="17"/>
      <rect x="912" y="88" width="244" height="140" rx="17"/>
    </g>
    <g fill="#123e45" font-size="22" font-weight="700">
      <text x="164" y="144">Browser</text>
      <text x="454" y="144">Nginx</text>
      <text x="744" y="144">Django</text>
      <text x="1034" y="144">Site data</text>
    </g>
    <g fill="#627981" font-size="16">
      <text x="164" y="182">Vue · visual editing</text>
      <text x="454" y="182">Pages, media and API</text>
      <text x="744" y="182">Content and accounts</text>
      <text x="1034" y="182">SQLite · uploads</text>
    </g>
  </g>
  <g fill="none" stroke="#0b8990" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M297 158H321"/>
    <path d="M587 158H611"/>
    <path d="M877 158H901"/>
  </g>
  <rect x="430" y="257" width="340" height="36" rx="18" fill="#e3f3f4"/>
  <text x="600" y="281" text-anchor="middle" fill="#116a72" font-family="Arial, sans-serif" font-size="15" font-weight="600">systemd services · scheduled backups</text>
</svg>
