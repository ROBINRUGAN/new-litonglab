# designed by mew
# The installer fills in domains and the backend port, then enables HTTPS.
server {
    listen 80;
    server_name lab.example.edu;
    root /srv/litonglab/current/frontend/dist;
    #SSL-START SSL configuration
    #error_page 404/404.html;
    #SSL-END

    index index.html;
    client_max_body_size 52m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/litonglab/acme;
    }

    location = /api/manage/restore/ {
        client_max_body_size 513m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/manage/backups/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
    location /admin/ {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /media/ {
        alias /var/lib/litonglab/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
    location ~* ^/(assets|images|icons|papers)/ {
        try_files $uri =404;
        expires 7d;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
